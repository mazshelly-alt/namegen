apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb

spec:
  serviceName: mongodb
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
      - name: mongodb
        image: mongo:7

        ports:
        - containerPort: 27017

        volumeMounts:
        - mountPath: /data/db
          name: mongo-storage

  volumeClaimTemplates:
  - metadata:
      name: mongo-storage

    spec:
      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: 10Gi
